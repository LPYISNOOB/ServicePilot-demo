name: ServicePilot CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run tests
        env:
          SERVICEPILOT_MODEL_MODE: mock
          SERVICEPILOT_DB_PATH: ${{ runner.temp }}/servicepilot-test.db
          SERVICEPILOT_CHECKPOINT_PATH: ${{ runner.temp }}/checkpoints.db
        run: pytest
      - name: Run offline evaluation
        env:
          SERVICEPILOT_MODEL_MODE: mock
          SERVICEPILOT_DB_PATH: ${{ runner.temp }}/servicepilot-eval.db
          SERVICEPILOT_CHECKPOINT_PATH: ${{ runner.temp }}/eval-checkpoints.db
        run: servicepilot-eval
      - name: Build Docker image
        run: docker build -t servicepilot:ci .

