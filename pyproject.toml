[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "servicepilot-ai"
version = "0.1.0"
description = "A production-shaped LangGraph customer-support workflow with RAG, HITL, audit, and evaluation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ServicePilot Project" }]
dependencies = [
  "langchain>=1.3.10,<2",
  "langchain-core>=1.3.3,<2",
  "langchain-openai>=1.1.14,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=2.1,<3",
  "python-dotenv>=1.2,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx2>=2.10,<3"]

[project.scripts]
servicepilot-init = "servicepilot.seed:main"
servicepilot-cli = "servicepilot.cli:main"
servicepilot-eval = "servicepilot.evaluation:main"
servicepilot-api = "servicepilot.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servicepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
